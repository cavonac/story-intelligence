# Story Intelligence runtime config.
# Single consumer: agents/setup.md (bootstrap + smoke test).
# Runtime judgments -- chunk sizing, retries, parallelism, logging,
# model-to-hardware fit -- belong to the agent and harness, not this file.

llm:
  # Exact model name your harness loads.
  # setup.md loads this in pre-flight and stops if it is missing.
  # No fallback key on purpose: a missing model is a human decision.
  default_model: Qwen3.8-27B-UD-Q4_K_M

storage:
  # Absolute paths, so a cron job's working directory can't relocate the runtime.
  wiki_root: C:/SRC/story-intelligence/obsidian-vault
  database: C:/SRC/story-intelligence/data/knowledge.db
  graph_cache: C:/SRC/story-intelligence/data/graph
  processed_documents: C:/SRC/story-intelligence/data/processed
