# Story Intelligence runtime config.
# Single consumer: tasks/setup.md

llm:
  # Exact model name your harness loads.
  # setup.md loads this in pre-flight and stops if it is missing.
  # No fallback key on purpose: a missing model is a human decision.
  default_model: Qwen3.8-27B-UD-Q4_K_M

# Set STORY_INTELLIGENCE_ROOT environment variable prior to running setup
storage:
  project_root: "${STORY_INTELLIGENCE_ROOT}"
  wiki_root: "${STORY_INTELLIGENCE_ROOT}/obsidian-vault"
  database: "${STORY_INTELLIGENCE_ROOT}/data/knowledge.db"
  graph_cache: "${STORY_INTELLIGENCE_ROOT}/data/graph"
  processed_documents: "${STORY_INTELLIGENCE_ROOT}/data/processed"
